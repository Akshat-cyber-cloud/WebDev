version: "3"

services:
  app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    volumes:
      - .:/app          # ← remove :cached
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"    # ← keep this, essential for Windows
    command: npx nodemon --legacy-watch --watch . --ext js,json server.js